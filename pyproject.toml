[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "waguri-framework"
version = "0.1.0"
description = "AI Reliability and Response Validation Framework"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]
ollama = [
    "httpx>=0.27"
]

[tool.hatch.build.targets.wheel]
packages = ["src/waguri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"